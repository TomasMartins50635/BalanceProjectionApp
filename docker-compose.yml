services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: balance_projection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=balance_projection;Username=postgres;Password=postgres"
    ports:
      - "5535:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
