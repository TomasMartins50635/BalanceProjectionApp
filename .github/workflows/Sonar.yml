name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud blame information

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install coverage report tool
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"TomasMartins50635_BalanceProjectionApp" \
            /o:"tomasmartins50635" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**"

      - name: Restore dependencies
        run: dotnet restore BalanceProjectionApp.slnx

      - name: Build
        run: dotnet build BalanceProjectionApp.slnx --configuration Release --no-restore

      - name: Test with coverage
        shell: bash
        run: |
          if find . \( -name "*.Test.csproj" -o -name "*.Tests.csproj" \) -print -quit | grep -q .; then
            dotnet test BalanceProjectionApp.slnx \
              --configuration Release \
              --no-build \
              --collect:"XPlat Code Coverage" \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          else
            echo "No test projects found. Skipping tests."
          fi

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
