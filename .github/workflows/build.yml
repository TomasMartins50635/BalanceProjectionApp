name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BalanceProjectionApp.slnx

      - name: Build
        run: dotnet build BalanceProjectionApp.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          if find . -name "*Test*.csproj" -print -quit | grep -q .; then
            dotnet test BalanceProjectionApp.slnx --configuration Release --no-build --verbosity normal
          else
            echo "No test projects found. Skipping tests."
          fi
