name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BalanceProjectionApp.slnx

      - name: Build
        run: dotnet build BalanceProjectionApp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BalanceProjectionApp.slnx --configuration Release --no-build --verbosity normal
