name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ui/desktop/src-tauri -> target

      - name: Install web dependencies
        run: npm ci
        working-directory: ui/web

      - name: Install desktop dependencies
        run: npm ci
        working-directory: ui/desktop

      - name: Build Tauri app
        run: npm run build
        working-directory: ui/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish sync server
        run: |
          dotnet publish sync-server -c Release -r win-x64 --self-contained -o publish/sync-server
          Compress-Archive -Path publish/sync-server/* -DestinationPath publish/sync-server-win-x64.zip
        shell: pwsh

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content ui/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $nsisDir = "ui/desktop/src-tauri/target/release/bundle/nsis"

          Write-Host "=== Ficheiros em $nsisDir ==="
          Get-ChildItem $nsisDir | ForEach-Object { Write-Host "  $($_.Name)" }

          # createUpdaterArtifacts=true assina o instalador diretamente (.exe/.exe.sig),
          # não produz .nsis.zip/.nsis.zip.sig (esse é o formato v1Compatible).
          $sigFile = Get-ChildItem "$nsisDir/*.exe.sig" | Select-Object -First 1
          $exeFile = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1

          if (-not $sigFile) {
            Write-Error "ERRO: Ficheiro .exe.sig nao encontrado. A assinatura do Tauri falhou — verifica TAURI_SIGNING_PRIVATE_KEY e TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          }

          # O nome de build (a partir do productName "Gestão Tesouraria") tem acento e
          # espaço. O GitHub sanitiza nomes de assets ao publicá-los (acento e espaço
          # desaparecem), o que desalinhava o URL aqui gerado do URL real do asset,
          # causando 404 no updater. Renomeia para um nome ASCII estável e usa-o em
          # ambos os sítios — o rename não invalida a assinatura (é sobre o conteúdo).
          $safeName = "GestaoTesouraria_${version}_x64-setup.exe"
          Rename-Item -Path $exeFile.FullName -NewName $safeName
          Rename-Item -Path $sigFile.FullName -NewName "$safeName.sig"
          $sigFile = Get-Item "$nsisDir/$safeName.sig"

          $payload = [ordered]@{
            version  = $version
            notes    = ""
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigFile -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/v${version}/$safeName"
              }
            }
          }

          $payload | ConvertTo-Json -Depth 5 |
            Out-File -FilePath latest.json -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ui/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ui/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
            publish/sync-server-win-x64.zip
            sync-server/install.ps1
